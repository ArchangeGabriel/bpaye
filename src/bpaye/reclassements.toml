# Tableaux de reclassement par grille et par date (reclassement.py).
#
# Une ligne par position de la grille de bpaye : échelon, ou chevron d'un groupe hors
# échelle (trois positions par groupe HEA ou HEB). Règles d'ancienneté : « conservee »
# (par défaut ; le texte dit « ancienneté acquise »), « neant » (« sans ancienneté »),
# majoration en années (« ancienneté acquise majorée de 3 mois » : 0.25). L'ancienneté
# conservée l'est dans la limite de la durée de l'échelon d'arrivée (reclassement.py).
#
# Règle préalable du PPCR (décret 2017-786, art. 37, 63, 82, 110, 140, 158) : celui qui, le
# 1er septembre 2017, est promu au 4e échelon de la classe normale (ou titularisé, ou promu
# de grade ou de corps) l'est d'abord selon l'ancien statut, puis reclassé ce même jour :
# reclassement.py prend l'échelon détenu le jour même.

# ── Agrégés : décret 2017-786, art. 62 (tableaux) et 63 ─────────────────────────
[[GRILLE_AGCN]]
date = 2017-09-01
source = "décret 2017-786, art. 62, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000034600973"
table = [
  { ancien = 1, nouveau = 1 },
  { ancien = 2, nouveau = 1, majoration = 0.25 },
  { ancien = 3, nouveau = 3 },
  { ancien = 4, nouveau = 4 },
  { ancien = 5, nouveau = 5 },
  { ancien = 6, nouveau = 6 },
  { ancien = 7, nouveau = 7 },
  { ancien = 8, nouveau = 8 },
  { ancien = 9, nouveau = 9 },
  { ancien = 10, nouveau = 10 },
  { ancien = 11, nouveau = 11 },
]

[[GRILLE_AGHC]]
