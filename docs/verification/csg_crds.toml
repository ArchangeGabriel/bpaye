# CSG, CRDS et plafond de la sécurité sociale — bpaye
# Relevé le 2026-10-18 sur Légifrance (versions consolidées datées des codes et de
# l'ordonnance 96-50 ; arrêtés et décrets au JORF).
# « MANQUANT » = non lu dans un texte officiel : ne rien coder dessus.
# Convention : `depuis` = date d'effet ; `jusqu_a` = veille de la version suivante (exclue),
# absent = en vigueur au 2026-10-18. Quand le texte modificatif ne fixe pas de date
# d'application, `depuis` est la date de la version du code qu'il crée (lendemain du JORF).

[meta]
date_releve = 2026-10-18
methode = "Légifrance, version consolidée à la date indiquée dans chaque URL ; JORF pour les plafonds"
utilise_par = "taux.toml : csg.*, crds.*, pmss ; charges.seuil_abattement"

# ---------------------------------------------------------------------------
# 1. RÉDUCTION POUR FRAIS PROFESSIONNELS (CSS L136-2, I, puis L136-1-1 depuis 2018-2019)
# ---------------------------------------------------------------------------
[[csg.reduction]]
depuis = 2001-01-01
jusqu_a = 2005-01-01
taux = 0.05
plafond = "aucun"
regle = "il est opéré une réduction représentative de frais professionnels forfaitairement fixée à 5 p. 100 de ce montant"
source = "CSS L136-2, I, al. 2, versions du 24/12/2000 au 17/08/2004 (relues au 01/06/2001, 01/06/2002, 01/06/2003, 01/06/2004), https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006740248/2001-06-01"

[[csg.reduction]]
depuis = 2005-01-01
jusqu_a = 2010-12-22
taux = 0.03
plafond = "aucun"
regle = "… forfaitairement fixée à 3 p. 100 de ce montant"
source = "CSS L136-2 mod. par loi 2004-810 art. 72, version du 17/08/2004 ; nota : « applicables aux revenus perçus à compter du 1er janvier 2005 » (art. 72 V), https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006740248/2005-06-01"

[[csg.reduction]]
depuis = 2010-12-22
jusqu_a = 2011-12-23
taux = 0.03
plafond = "4 × plafond mensuel (L241-3)"
regle = "Sur le montant brut inférieur à quatre fois la valeur du plafond mentionné à l'article L. 241-3 des traitements, […] il est opéré une réduction […] fixée à 3 % de ce montant."
source = "loi 2010-1594 (LFSS 2011) art. 20, 1°, JORF n° 295 du 21/12/2010, https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000023261162 ; CSS L136-2 version du 22/12/2010, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006740248/2011-06-01"
note = "L'art. 20 ne fixe pas de date d'application (le nota du code cite l'art. 24 III, qui vise un autre article) : date de la version du code."

[[csg.reduction]]
depuis = 2011-12-23
taux = 0.0175
plafond = "4 × plafond mensuel (L241-3)"
regle = "Le taux : « 3 % » est remplacé par le taux : « 1,75 % »"
source = "loi 2011-1906 (LFSS 2012) art. 17, I, 2°, JORF n° 296 du 22/12/2011, https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000025005945 ; CSS L136-2 version du 23/12/2011 ; inchangé dans les versions du 01/01/2015, 01/01/2018 et du 01/09/2018 (« fixée à 1,75 % pour leur montant inférieur à quatre fois la valeur du plafond »)"
note = "L'art. 17 ne fixe pas de date d'application : date de la version du code."

# ---------------------------------------------------------------------------
# 2. TAUX DE LA CSG SUR LES REVENUS D'ACTIVITÉ (CSS L136-8, I)
# ---------------------------------------------------------------------------
[[csg.taux]]
depuis = 2001-01-01
jusqu_a = 2002-01-01
taux = "MANQUANT"
source = "MANQUANT : L136-8 n'apparaît pas dans la version du chapitre au 01/06/2001 ; le texte qui fixait alors le taux n'est pas relu"

[[csg.taux]]
depuis = 2002-01-01
jusqu_a = 2018-01-01
taux = 0.075
regle = "est fixé à 7,50 p. 100 (2002–2004) ; « 1° A 7,5 % pour la contribution sociale mentionnée à l'article L. 136-1 » (2004–2017)"
source = "CSS L136-8, versions du 01/01/2002 (loi 2001-647 art. 9), du 17/08/2004 (loi 2004-810 art. 72), du 22/12/2010 et du 01/01/2017, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006073189/LEGISCTA000006156362/2017-06-01/"

[[csg.taux]]
depuis = 2018-01-01
taux = 0.092
regle = "1° A 9,2 % pour la contribution sociale mentionnée à l'article L. 136-1"
source = "CSS L136-8 mod. par loi 2017-1836 art. 8, version du 01/01/2018, https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006073189/LEGISCTA000006156362/2018-06-01/"

# ---------------------------------------------------------------------------
# 3. PART DÉDUCTIBLE (CGI art. 154 quinquies, I)
# ---------------------------------------------------------------------------
[[csg.deductible]]
depuis = 2001-01-01
jusqu_a = 2018-01-01
points = 0.051
regle = "est, à hauteur de 5,1 points […] admise en déduction"
source = "CGI 154 quinquies, versions du 31/03/2001, 01/01/2004, 01/01/2005, 28/12/2007 et 08/08/2015, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054336634/2011-06-01"

[[csg.deductible]]
depuis = 2018-01-01
points = 0.068
regle = "est, à hauteur de 6,8 points […] admise en déduction"
source = "CGI 154 quinquies mod. par loi 2017-1837 art. 67, version du 01/01/2018, https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000054336634/2018-06-01"

[csg.non_deductible]
regle = "taux de L136-8 moins la part déductible : 7,5 − 5,1 = 2,4 points (2002–2017), 9,2 − 6,8 = 2,4 points (depuis 2018)"

# ---------------------------------------------------------------------------
# 4. CRDS (ordonnance 96-50, art. 14 et 19)
# ---------------------------------------------------------------------------
[crds.assiette]
regle = "Cette contribution est assise sur les revenus visés et dans les conditions prévues aux articles L. 136-2 à L. 136-4 et au III de l'article L. 136-8"
source = "Ord. 96-50 art. 14, I, versions du 31/12/2000, du 17/08/2004, du 01/01/2011 et du 01/01/2015, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000190291/2012-06-01/ ; « L. 136-1-1 à L. 136-4 » dans la version en vigueur"
note = "La réduction et son plafond sont ceux de la CSG, aux mêmes dates. Aucun texte ne fait passer la réduction de la CRDS à 1,75 % en 2015."

[[crds.taux]]
depuis = 1996-01-25
taux = 0.005
source = "Ord. 96-50 art. 19, versions du 25/01/1996 (« 0,5 p. 100 »), du 01/01/2006 (loi 2005-1720 art. 112), du 13/05/2010 (loi 2010-476 art. 50, « 0,5 % ») et du 01/01/2020, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000190291/2008-06-01/"

