# ── Indemnité compensatrice de la hausse de la CSG (décret 2017-1889) ────────────────────
# https://www.legifrance.gouv.fr/loda/id/JORFTEXT000036342240/2018-06-01/ et /2026-10-17/
# Art. 2 : version unique, en vigueur depuis le 01/01/2018.

[[icsg_regle]]
cas = "nommé ou recruté à compter du 2018-01-01 (art. 2 III)"
formule = "rémunération mensuelle brute à la date de la nomination ou du recrutement × 0,76 %"
exclusion = "agents affiliés au régime général de la sécurité sociale au titre des prestations en espèces de l'assurance maladie"
source = "décret 2017-1889, art. 2 III, version en vigueur depuis le 01/01/2018"

[[icsg_regle]]
cas = "assiette (art. 2 IV)"
definition = "les éléments de rémunération perçus au titre de l'activité publique assujettis à la CSG, hors activités accessoires (art. 25 septies loi 83-634, etc.) ; pour II et III : « la première rémunération servie au titre d'un mois complet »"
source = "décret 2017-1889, art. 2 IV, version en vigueur depuis le 01/01/2018"

[[icsg_regle]]
cas = "réintégration d'un agent non rémunéré au 31/12/2017 (art. 2 II)"
formule = "rémunération brute mensuelle à la date de la réintégration × 0,76 %"
source = "décret 2017-1889, art. 2 II"

[[icsg_regle]]
cas = "en poste avant le 2018-01-01 (art. 2 I)"
formule = "(rémunération brute annuelle 2017 × 1,6702 % − contribution exceptionnelle de solidarité − cotisation salariale maladie − contribution salariale chômage dues sur cette rémunération) × 1,1053"
source = "décret 2017-1889, art. 2 I"

[[icsg_reevaluation]]
date = 2019-01-01
regle = "au 1er janvier 2019, si la rémunération (art. 2 IV) a progressé entre 2017 et 2018, réévaluation proportionnelle à cette progression"
source = "décret 2017-1889, art. 5, version du 01/01/2018 au 01/01/2020"

[[icsg_reevaluation]]
date = 2020-01-01
regle = "idem au 1er janvier 2020, progression entre 2018 et 2019 (premier alinéa du IV)"
source = "décret 2017-1889, art. 5, version du 01/01/2020 au 01/01/2021, mod. décret 2019-1595 du 31 décembre 2019, art. 1"

[[icsg_reevaluation]]
date = 2021-01-01
regle = "au 1er janvier de chaque année, si la rémunération a « évolué » entre l'année civile écoulée et la précédente, réévaluation proportionnelle ; changement de quotité ou congé maladie de l'année neutralisés"
source = "décret 2017-1889, art. 5, version en vigueur depuis le 01/01/2021, mod. décret 2020-1626 du 18 décembre 2020, art. 1 (entrée en vigueur art. 2)"
note = "« progressé » (2019-2020) devient « évolué » (2021-) : depuis 2021 la réévaluation peut aussi baisser l'indemnité"
