# ── Remboursement de transport (décret 2010-676, art. 3) ─────────────────────────────────
# https://www.legifrance.gouv.fr/loda/id/JORFTEXT000022374455/2012-01-01/ (version du 01/07/2010
# au 07/10/2015), /2020-01-01/ (du 07/10/2015 au 01/09/2023), /2026-10-17/ (depuis le 01/09/2023).

[[transport_regle]]
date = 2010-07-01
taux = 0.50
plafond = "50 % de la somme des tarifs des abonnements annuels cumulés permettant d'effectuer depuis Paris le trajet maximum et le trajet minimum (zone de l'autorité organisatrice d'Île-de-France)"
source = "décret 2010-676, art. 3, version du 01/07/2010 au 07/10/2015, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000022374455/2012-01-01/"

[[transport_regle]]
date = 2015-10-07
taux = 0.50
plafond = "plafond fixé à partir du tarif de l'abonnement annuel permettant le trajet maximum en Île-de-France, après application d'un coefficient multiplicateur égal à 1,25"
source = "décret 2010-676, art. 3, version du 07/10/2015 au 01/09/2023, mod. décret 2015-1228 du 2 octobre 2015, art. 1, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000022374455/2020-01-01/"

[[transport_regle]]
date = 2023-09-01
taux = 0.75
plafond = "même rédaction (tarif annuel du trajet maximum × 1,25)"
source = "décret 2010-676, art. 3, version depuis le 01/09/2023, mod. décret 2023-812 du 21 août 2023, art. 1 (trajets effectués à compter du 1er septembre 2023, art. 2), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000022374455/2026-10-17/"

