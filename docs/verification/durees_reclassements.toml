# Règles de classement lors d'une promotion de grade (certifiés)
[[classement.CERTIFIE_HC]]
date   = 1996-09-01
source = "décret 72-581, art. 35, version DU 01 SEPTEMBRE 1996 AU 01 SEPTEMBRE 2017, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000306772/2016-01-01"
condition_acces = "art. 34 (version DU 01 SEPTEMBRE 2010 AU 01 SEPTEMBRE 2017) : « lorsqu'ils ont atteint au moins le 7e échelon de la classe normale »"
regle  = "« classés, dès leur nomination, à l'échelon comportant un indice égal ou à défaut immédiatement supérieur à celui dont ils bénéficiaient dans la classe normale. » « Dans la limite de l'ancienneté exigée à l'article 33 ci-dessus pour une promotion à l'échelon supérieur, les intéressés conservent l'ancienneté qu'ils avaient acquise dans l'échelon de leur ancienne classe lorsque l'augmentation de traitement consécutive à leur promotion est inférieure à celle que leur aurait procurée un avancement d'échelon dans leur ancienne classe. » « Les professeurs certifiés ayant atteint le 11e échelon de la classe normale conservent l'ancienneté qu'ils avaient acquise dans cet échelon dans la limite du temps nécessaire à une promotion d'échelon dans la hors-classe. »"

[[classement.CERTIFIE_HC]]
date   = 2017-09-01
source = "décret 72-581, art. 35, version DU 01 SEPTEMBRE 2017 AU 01 JANVIER 2020 (2017-786 art. 76), puis DEPUIS LE 01 JANVIER 2020 (2019-1554 art. 19, même règle), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000306772/2017-09-01 et …/2021-06-01"
condition_acces = "art. 34 : au moins deux ans d'ancienneté dans le 9e échelon (non relu mot à mot ici pour les certifiés ; texte lu pour les agrégés, art. 13 quinquies)"
regle  = "Même règle indice égal ou immédiatement supérieur, ancienneté conservée dans la limite de l'art. 32 si le gain est inférieur à celui d'un avancement d'échelon. « Par dérogation à l'alinéa précédent, les agents classés au 9e échelon de la classe normale à la date de leur promotion sont classés au 2e échelon de leur nouveau grade, avec conservation de l'ancienneté acquise au-delà de 2 ans dans leur échelon d'origine. » 11e échelon : ancienneté conservée dans la limite du temps nécessaire à une promotion d'échelon dans la hors-classe."

[[classement.CERTIFIE_CE]]
date   = 2017-09-01
source = "décret 72-581, art. 36-1, version DU 01 SEPTEMBRE 2017 AU 01 JANVIER 2020 (2017-786 art. 78) ; version DEPUIS LE 01 JANVIER 2021 (2017-786 art. 86) : « 7e échelon de la hors-classe » au lieu du 6e, https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000306772/2026-10-17"
regle  = "« classés, dès leur nomination, à l'échelon comportant un indice égal ou à défaut immédiatement supérieur à celui dont ils bénéficiaient dans la hors-classe. » Ancienneté conservée dans la limite de l'art. 32 si le gain est inférieur à celui d'un avancement d'échelon. « Les professeurs certifiés ayant atteint le 6e [7e depuis le 2021-01-01] échelon de la hors-classe conservent l'ancienneté qu'ils avaient acquise dans cet échelon dans la limite du temps nécessaire à une promotion d'échelon dans la classe exceptionnelle. »"
condition_acces = "art. 36 (2017) : I. au moins le 3e échelon de la HC et huit années de fonctions difficiles/particulières ; III. dans la limite de 20 % des promotions, « ayant atteint le 6e échelon de la hors-classe » et valeur professionnelle exceptionnelle"

