source = "décret 68-503, art. 5, VERSION EN VIGUEUR DEPUIS LE 01 JANVIER 1967 (inchangé au 2026-10-17), https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000868842/2026-10-17"
