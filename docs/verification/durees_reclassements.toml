regle  = "« classés lors de leur première nomination à l'échelon comportant un traitement égal ou immédiatement supérieur au traitement dont ils bénéficiaient dans leur ancien corps. » « Dans la limite de l'ancienneté exigée à l'article 4 ci-dessus pour une promotion à l'échelon supérieur, ils conservent l'ancienneté acquise dans leur ancien échelon si leur nomination leur procure un gain indiciaire inférieur à celui que leur aurait donné une promotion d'échelon dans leur ancien grade. » « Toutefois, les professeurs qui appartenaient au 11e échelon de leur corps d'origine en ce qui concerne les professeurs agrégés de l'enseignement du second degré, ou au 6e échelon en ce qui concerne les maîtres assistants agrégés, conservent l'ancienneté qu'ils avaient acquise dans cet échelon dans la limite du temps nécessaire à une promotion d'échelon. »"
note   = "Rien dans l'art. 5 sur un agrégé venant de la hors classe ou de la classe exceptionnelle au dernier échelon : seule la règle générale s'applique."

