# Codes de rubrique DGFiP (PAY) de cinq indemnités de l'Éducation nationale.
# Vérifié le 2026-10-17. Sources : documents DGFiP republiés par l'AMUE (édition du
# 1er janvier 2026, xlsx ; annexe 14 b de janvier 2023, pdf), adresses ci-dessous.
# Numéros de ligne : rang de la ligne dans la feuille, en-tête compris (même convention
# que codes.toml). Le code à 6 chiffres est celui du fichier BJ (« 20 » + code IR).

