[[code]]
indemnite = "ISS des professeurs documentalistes (décret 91-467)"
statut = "trouvé, avec une discordance entre documents"
code_ir = "0413"
code = "200413"
libelle_officiel = "Indemnité de sujétions particulières en faveur des personnels assurant des fonctions de documentation ou d’information dans un EPLE du 2ème degré"
libelle_bj = "IND. SUJ. PARTICULIERES"
imposable = true
source = "DGFiP, annexe 14 B 2026 (copie AMUE), ligne 202, observations « Décret n° 91-467 du 14 mai 1991 » ; annexe 14 b janvier 2023, p. 8 ; BJ janvier 2026 ligne 487 « D91-467*14/05/1991 » ; INGRES ligne 427 (code 413, IMPOSA 1)"
note = "Discordance : l'INGRES 2026 libelle le code 413 « Indemnité de sujétions particulières en faveur des directeurs de cio et des conseillers d'orientations psychologues » et le rattache au texte 7553 = décret 91-466 (fin de validité 2017-08-31), alors que l'annexe 14 B et le BJ disent décret 91-467 (documentation). Le décret 91-467 n'est pas porté par une autre rubrique dans ces fichiers. Le nom exact de l'indemnité est « sujétions particulières », pas « sujétions spéciales »."

