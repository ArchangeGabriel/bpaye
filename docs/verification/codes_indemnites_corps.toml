source = "MANQUANT : aucune rubrique « bonification indiciaire » des directeurs d'école dans l'annexe 14 B 2026, l'INGRES 2026 ni le BJ janvier 2026 (seule 201314 « BONIFICATION INDEMNITAIRE », décret 2006-778, sans rapport). Les codes de traitement du BJ (101000 TRAITEMENT BRUT, 101070 TRAITEMENT BRUT N.B.I.) n'en ont pas non plus."
