[gipa]
champ = "fonctionnaires, militaires, magistrats, personnels des cultes ; contractuels CDI, et CDD continus chez le même employeur, rémunérés par référence à un indice (art. 1, version du 19/11/2017) ; grade dont l'indice sommital ≤ HEB (art. 2)"
source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000018934143/2026-10-17/ — décret 2008-539, version consolidée au 17/10/2026"

[gipa.formule]
texte = "G = TIB de l'année de début de la période de référence X (1 + inflation sur la période de référence) - TIB de l'année de fin de la période de référence."
inflation = "Inflation sur la période de référence = (Moyenne IPC de l'année de fin de la période de référence/Moyenne IPC de l'année de début de la période de référence) ― 1."
tib = "Le TIB de l'année pris en compte correspond à l'indice majoré détenu au 31 décembre de chacune des deux années bornant la période de référence multiplié par la valeur moyenne annuelle du point pour chacune de ces deux années."
exclusions = "Sont exclus de la détermination du montant de la garantie l'indemnité de résidence, le supplément familial de traitement, la nouvelle bonification indiciaire et toutes les autres primes et indemnités pouvant être servies aux agents."
source = "décret 2008-539 art. 3, en vigueur depuis le 21/02/2008"
eligibilite = "rémunéré sur un emploi public au moins 3 ans sur les 4 ; même qualité (fonctionnaire, etc.) aux deux bornes (art. 9, version du 19/11/2017)"
temps_partiel = { texte = "Pour les agents ayant effectué une période de travail à temps partiel sur tout ou partie de la durée de la période de référence en cause, le montant de la garantie est attribué à hauteur de la quotité travaillée au 31 décembre de l'année qui clôt la période de référence.", source = "décret 2008-539 art. 10, version du 11/12/2009 (décret 2009-1520)" }
exclusions_versement = "emploi fonctionnel (sauf C et B) à une borne ; poste à l'étranger au 31/12 de fin ; sanction ayant baissé le traitement (art. 10)"
rafp = { texte = "l'indemnité dite de garantie individuelle du pouvoir d'achat [...] fait partie des éléments de rémunération soumis à cotisations au régime de retraite additionnelle de la fonction publique [...]. A titre dérogatoire, cette indemnité n'est pas soumise à la limite fixée au deuxième alinéa du même article.", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000019491873/2026-10-17/ — décret 2008-964 art. 1 (en vigueur depuis le 18/09/2008) ; art. 2 qui limitait aux années 2008–2011 abrogé le 05/05/2014 par décret 2014-452" }
arrete_annuel = "décret 2008-539 art. 8 (version du 01/01/2009) : un arrêté budget + fonction publique fixe le taux d'inflation et les valeurs annuelles du point"

