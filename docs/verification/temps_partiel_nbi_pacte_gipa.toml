# Vérification sur sources officielles pour bpaye — 2026-10-17
# Règle : chaque valeur a une `source` (URL datée, article, version) et, pour une règle,
# la phrase du texte (`texte`). Ce qui n'a pas été lu est marqué MANQUANT.
# Tous les textes Légifrance ont été lus dans la version consolidée au 2026-10-17, sauf
# mention contraire.
# `derive = true` : valeur calculée à partir de textes lus, pas écrite telle quelle.

# ======================================================================
# 1. TEMPS PARTIEL ET QUOTITÉ
# ======================================================================
[temps_partiel]
note = "L'ordonnance 82-296 (art. 6 pour la rémunération, pas l'art. 2) est abrogée depuis le 01/03/2022 par l'ordonnance 2021-1574 ; la règle est désormais au CGFP, art. L612-5. Pour l'État, elle était avant 2022 à l'art. 40 de la loi 84-16 (MANQUANT : non relu)."

[temps_partiel.fraction_generale]
regle = "fraction = durée hebdomadaire effectuée / durée des obligations hebdomadaires à temps complet ; s'applique au traitement, à l'IR et aux primes et indemnités de toute nature"
texte = "Le fonctionnaire autorisé à travailler à temps partiel perçoit une fraction du traitement, de l'indemnité de résidence ainsi que des primes et indemnités de toute nature afférentes soit à son grade et à son échelon, soit à l'emploi auquel il a été nommé. Cette fraction est égale au rapport entre la durée hebdomadaire du service effectué et la durée résultant des obligations hebdomadaires de service réglementairement fixées pour les fonctionnaires de même grade exerçant à temps complet les mêmes fonctions dans l'administration ou le service concerné."
source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000044416551/LEGISCTA000044423499/2026-10-17/ — CGFP art. L612-5, al. 1-2, version en vigueur depuis le 01/03/2022 (création ordonnance 2021-1574)"

[temps_partiel.fraction_80_90]
q80 = "6/7"
q90 = "32/35"
texte = "Pour les quotités égales à 80 ou 90 % du temps complet et par dérogation au second alinéa, cette fraction est égale respectivement aux six septièmes ou aux trente-deux trente-cinquièmes de la rémunération mentionnée au premier alinéa."
source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000044416551/LEGISCTA000044423499/2026-10-17/ — CGFP art. L612-5, al. 3, en vigueur depuis le 01/03/2022"
source_historique = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000889074/2022-02-28/ — ordonnance 82-296 art. 6, version du 02/04/1982 au 01/03/2022 (« 6/7 ou aux 32/35 du traitement, des primes et indemnités »)"

[temps_partiel.quotites_autorisees]
sur_autorisation = [50, 60, 70, 80, 90]
de_droit = [50, 60, 70, 80]
source_autorisation = "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006063839/2026-10-17/ — décret 82-624 art. 1 al. 1, en vigueur depuis le 14/06/2015 (décret 2015-652)"
source_droit = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000044416551/LEGISCTA000044423499/2026-10-17/ — CGFP art. L612-3 (« selon une quotité de 50, 60, 70 ou 80 % »), en vigueur depuis le 01/03/2022 ; aussi décret 82-624 art. 1-2"

[temps_partiel.enseignants_quotite_amenagee]
regle = "Personnels à obligations de service dont la quotité est aménagée entre 80 % et 90 % : fraction de rémunération (en %) = quotité × 4/7 + 40, arrondie à un chiffre après la virgule"
texte = "les personnels relevant d'un régime d'obligations de service, dont la quotité de temps de travail est aménagée entre 80 % et 90 %, perçoivent une fraction de rémunération calculée en pourcentage selon la formule suivante : (Quotité de temps partiel aménagée en pourcentage d'un service à temps complet x 4/7) + 40. Pour le calcul de cette fraction de rémunération, il est retenu un pourcentage exprimé avec un chiffre après la virgule."
source = "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006063839/2026-10-17/ — décret 82-624 art. 1 al. 3-4, en vigueur depuis le 14/06/2015 (décret 2015-652 art. 4)"
controle = "la formule redonne 6/7 à 80 % (85,7) et 32/35 à 90 % (91,4)"
controle_derive = true
arrondi = "MANQUANT : le texte dit « un chiffre après la virgule » sans préciser arrondi ou troncature"

[temps_partiel.enseignants_second_degre_heures]
regle = "Second degré : service à temps partiel aménagé en nombre entier d'heures hebdomadaires ; quotité entre 50 % et 90 % ; la quotité est heures / ORS"
texte = "Pour les personnels des établissements d'enseignement du second degré, qui, relevant d'un régime d'obligations de service défini en heures hebdomadaires, exercent à temps partiel, la durée du service est aménagée de façon à obtenir un nombre entier d'heures hebdomadaires, correspondant à la quotité de temps de travail choisie et qui ne peut correspondre à une quotité de travail inférieure à 50 % ou supérieure à 90 %."
source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071191/LEGISCTA000030722423/2026-10-17/ — code de l'éducation art. R911-7 al. 2, en vigueur depuis le 14/06/2015"
source_cadre = "même URL — art. D911-4 : le décret 82-624 s'applique aux personnels de l'éducation « sous réserve des dispositions des articles R. 911-5 à R. 911-9 » ; CGFP L612-10 (« soit un nombre entier d'heures, soit un nombre entier de demi-journées ... La fraction de rémunération versée est adaptée dans les mêmes conditions »)"
note = "« quotité = heures / ORS » n'est pas écrit en toutes lettres : c'est L612-5 al. 2 (durée effectuée / obligations à temps complet) appliqué à R911-7. L'art. 1-1 du décret 82-624 ne traite pas de cela mais de la surcotisation."

[temps_partiel.enseignants_temps_partiel_de_droit]
regle = "Temps partiel de droit aménagé : rémunération au prorata (quotité), sauf si l'aménagement fait dépasser 80 % : alors formule de l'art. 1 du décret 82-624 (×4/7 + 40)"
texte = "La rémunération est calculée dans les conditions prévues au premier alinéa de l'article 40 de la loi n° 84-16 du 11 janvier 1984 [...], sauf si les règles d'aménagement des horaires définies dans le présent article conduisent la quotité de temps de travail des intéressés à dépasser 80 %. La rémunération est alors calculée dans les conditions prévues à l'article 1er du décret n° 82-624 du 20 juillet 1982"
source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071191/LEGISCTA000030722423/2026-10-17/ — code de l'éducation art. R911-9, en vigueur depuis le 14/06/2015"
note = "R911-9 renvoie encore à l'art. 40 de la loi 84-16, abrogée : son contenu est au CGFP L612-5."

[temps_partiel.annee_scolaire]
texte = "l'autorisation d'assurer un service à temps partiel n'est donnée que pour une période correspondant à une année scolaire [...] prennent effet au 1er septembre. La demande des intéressés doit être présentée avant le 31 mars précédant l'ouverture de l'année scolaire"
source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071191/LEGISCTA000030722425/2026-10-17/ — code de l'éducation art. R911-5, en vigueur depuis le 14/06/2015"

[temps_partiel.proratisation]
traitement = { proratise = true, source = "CGFP L612-5 (ci-dessus)" }
indemnite_residence = { proratise = true, source = "CGFP L612-5 (ci-dessus)" }
primes_en_general = { proratise = true, source = "CGFP L612-5 : « primes et indemnités de toute nature afférentes soit à son grade et à son échelon, soit à l'emploi »" }
isoe_part_fixe = { proratise = "MANQUANT (pas de clause temps partiel propre ; L612-5 s'applique a priori)", note = "décret 93-55 art. 2 (version du 15/02/2026, décret 2026-89) prorate selon la durée d'exercice des fonctions, pas selon la quotité : « Les personnels qui n'exercent pas cette fonction pendant l'intégralité de leurs obligations règlementaires de service bénéficient d'une fraction de cette part, calculée au prorata de la durée d'exercice des fonctions y ouvrant droit. »", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000725858/2026-10-17/" }
isoe_isae_part_fonctionnelle = { proratise = "MANQUANT : aucun texte lu ne dit si la part fonctionnelle (liée à une mission) suit la quotité" }
prime_attractivite = { proratise = "MANQUANT : décret 2021-276 consolidé au 2026-10-17 ne contient ni « temps partiel » ni « quotité » (recherche plein texte) ; L612-5 s'applique a priori", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000043246480/2026-10-17/" }
rep_rep_plus = { proratise = "MANQUANT : décret 2015-1087 consolidé au 2026-10-17 ne contient ni « temps partiel » ni « quotité » ; L612-5 s'applique a priori", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000031113279/2026-10-17/" }
prime_equipement_informatique = { proratise = false, texte = "Les personnels visés aux premier et deuxième alinéas qui exercent à temps partiel ou à temps incomplet perçoivent la prime à taux plein.", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000042614334/2026-10-17/ — décret 2020-1524 art. 1 al. 3, en vigueur depuis le 01/01/2021" }
nbi = { proratise = true, texte = "Les fonctionnaires autorisés à exercer leur activité à temps partiel et affectés sur un emploi ouvrant droit à la nouvelle bonification indiciaire perçoivent une fraction de celle-ci dans les conditions déterminées par le décret du 20 juillet 1982 susvisé.", source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000356073/2026-10-17/ — décret 91-1229 art. 3, en vigueur depuis le 08/12/1991" }

[temps_partiel.sft]
regle = "SFT proportionnel à la quotité de traitement soumis à retenue pour pension perçue, sauf l'élément fixe pour un enfant ; jamais inférieur au minimum d'un temps plein avec le même nombre d'enfants"
texte = "Sauf dérogations prévues par des dispositions législatives ou réglementaires, le supplément familial de traitement est, pour l'agent à temps partiel, fonction de la quotité de traitement soumis aux retenues pour pension qu'il perçoit, à l'exception de l'élément fixe prévu pour un enfant."
source = "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006064738/2026-10-17/ — décret 85-1148 art. 12, en vigueur depuis le 13/06/1999 (décret 99-491)"
plancher_texte = "Le supplément familial de traitement ne peut être inférieur au montant minimum versé aux fonctionnaires travaillant à temps plein ayant le même nombre d'enfants à charge."
plancher_source = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000044416551/LEGISCTA000044423499/2026-10-17/ — CGFP art. L612-6, en vigueur depuis le 01/03/2022"
bareme = { un_enfant_fixe = 2.29, deux_fixe = 10.67, deux_pct = 3, trois_fixe = 15.24, trois_pct = 8, par_enfant_sup_fixe = 4.57, par_enfant_sup_pct = 6, plafond_ib = 879, plancher_ib = 524, source = "même URL — décret 85-1148 art. 10 bis, en vigueur depuis le 01/01/2024 (décret 2023-519)" }

[temps_partiel.surcotisation]
regle = "Option L11 bis : périodes à temps partiel (depuis le 01/01/2004) décomptées comme temps plein, contre une retenue pour pension sur le traitement d'un temps plein ; gain limité à 4 trimestres (8 pour IPP ≥ 80 %)"
texte_L11bis = "les périodes de travail effectuées à temps partiel à compter du 1er janvier 2004 peuvent être décomptées comme des périodes de travail à temps plein, sous réserve du versement d'une retenue pour pension dont le taux est fixé par décret. Cette retenue est appliquée au traitement correspondant à celui d'un agent de même grade, échelon et indice travaillant à temps plein. Cette prise en compte ne peut avoir pour effet d'augmenter la durée de services mentionnée à l'article L. 13 de plus de quatre trimestres."
source_L11bis = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070302/LEGISCTA000006148893/2026-10-17/ — CPCMR art. L11 bis, en vigueur depuis le 01/01/2004 (loi 2003-775 art. 47)"
demande = "lors de la demande d'autorisation ou de son renouvellement ; en renouvellement tacite, au plus tard à la fin de la période précédente ; porte sur toute la période (décret 82-624 art. 1-1, en vigueur depuis le 30/12/2003, décret 2003-1307) — https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006063839/2026-10-17/"
taux_formule = "taux = t_salarié × q + 0,80 × (t_salarié + t_CNRACL_employeur) × (1 − q), q = quotité travaillée (pour un service aménagé : la quotité choisie) ; assiette = TIB temps plein y compris NBI"
texte_D5 = "I. - Le taux de la retenue pour pension prévue par l'article L. 11 bis [...] est la somme : 1° Du taux de la cotisation à la charge des agents prévue au 2° l'article L. 61, multiplié par la quotité de temps travaillé de l'agent ; 2° D'un taux égal à 80 % de la somme du taux mentionné au 1° et du taux mentionné au II de l'article 5 du décret n° 91-613 du 28 juin 1991 [...], multiplié par la quotité de temps non travaillé de l'agent. II. - Le taux mentionné au premier alinéa du I est appliqué au traitement indiciaire brut, y compris nouvelle bonification indiciaire [...] correspondant à celui d'un agent de même grade, échelon et indice que l'intéressé et exerçant à temps plein."
source_D5 = "https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000049064677/2026-10-17/ — CPCMR art. D5, en vigueur depuis le 01/02/2024 (décret 2024-49 art. 1), applicable aux cotisations des périodes à compter du 01/01/2024"
avant_2024 = "décret 2004-678 art. 2 (même formule, version du 01/09/2020 au 01/02/2024), abrogé par décret 2024-49 art. 6 — https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000439623/2026-10-17/ ; taux annuels 2004–2023 : MANQUANT (valeurs de 91-613 art. 5 II avant 2024 non relues)"
t_salarie = "11,10 % (cité par décret 2024-49 art. 5) ; le taux L61 lui-même : MANQUANT ici (non relu)"
derogation_options_anterieures = { taux_travaille = 11.10, taux_non_travaille = 33.40, texte = "pour les fonctionnaires et magistrats ayant opté pour le paiement de cette retenue pour pension à la date d'entrée en vigueur du présent décret, est égale à la somme de 11,10 % multiplié par la quotité de temps travaillé de et de 33,40 % multiplié par la quotité de temps non travaillé.", source = "https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049059894 — décret 2024-49 art. 5 (JORF), sans date de fin écrite" }

