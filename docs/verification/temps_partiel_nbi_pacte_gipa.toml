[temps_partiel.hsa]
regle = "Un enseignant titulaire du 2nd degré à temps partiel peut percevoir des HS (50-1253) pour les heures faites à sa demande au-delà des maxima résultant de sa quotité ; plafond mensuel = traitement net temps plein − traitement net à temps partiel. La 1re HS au-delà de ces maxima est majorée de 20 %."
texte_R911_6 = "Les personnels enseignants titulaires du second degré autorisés à travailler à temps partiel perçoivent des heures supplémentaires dans les conditions prévues par le décret n° 50-1253 du 6 octobre 1950 [...] lorsqu'ils effectuent à leur demande, des heures complémentaires d'enseignement excédant les maxima des services résultant de la quotité de travail à temps partiel. Pour chaque mois, la rémunération de ces heures ne doit pas être supérieure au montant résultant de la différence entre le traitement mensuel net afférent à l'exercice à temps plein des fonctions et celui correspondant à la quotité de travail à temps partiel prévue à l'alinéa précédent."
source_R911_6 = "https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071191/LEGISCTA000030722425/2026-10-17/ — code de l'éducation art. R911-6, en vigueur depuis le 15/10/2021 (décret 2021-1326 art. 1)"
avant_2021 = "décret 82-624 art. 3 bis (abrogé le 14/06/2015) puis R911-6 avant le 15/10/2021 : HS seulement pour des remplacements « exceptionnellement », « pour une période inférieure à la durée de l'année scolaire » — texte de 3 bis lu sur https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006063839/2026-10-17/ ; version de R911-6 du 14/06/2015 au 15/10/2021 : MANQUANT (non relue)"
texte_50_1253_art2 = "Dans la limite d'une heure supplémentaire excédant les maxima de services réglementaires ou les maxima des services résultant de la quotité de travail à temps partiel des personnes mentionnés à l'article premier ci-dessus, ce taux est majoré de 20%."
source_50_1253 = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000489039/2026-10-17/ — décret 50-1253 art. 1 et 2, en vigueur depuis le 15/10/2021 (décret 2021-1327)"
fonctionnaires_hors_enseignants = "décret 82-624 art. 3 (IHTS, contingent proportionnel à la quotité, heure = (TB annuel + IR temps plein) / 1820) — même URL 82-624, en vigueur depuis le 30/12/2003"

[temps_partiel.csg]
statut = "MANQUANT : aucune règle propre au temps partiel cherchée ni lue (l'assiette CSG porte sur les sommes versées)"

[temps_partiel.rafp]
regle = "Assiette RAFP limitée à 20 % du TIB total perçu dans l'année (donc du TIB proratisé à temps partiel) ; taux global 10 %, moitié agent, moitié employeur"
texte_art2 = "Ces éléments sont pris en compte dans la limite de 20 % du traitement indiciaire brut total ou de la solde brute totale perçus au cours de l'année considérée."
texte_art3 = "Le taux global de cotisation est fixé à 10 % du montant de l'assiette. Il est réparti à parts égales entre l'employeur et le bénéficiaire."
source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000803653/2026-10-17/ — décret 2004-569 art. 2 (version issue du décret 2024-348, dernière mise à jour du texte 17/04/2024) et art. 3 (en vigueur depuis le 19/06/2004)"
note = "« TIB perçu » à temps partiel = TIB proratisé : déduit du mot « perçus », pas écrit pour le temps partiel."

# ======================================================================
# 2. NBI
# ======================================================================
[nbi]
loi = "loi 91-73 art. 27"
texte_loi = "I. - La nouvelle bonification indiciaire des fonctionnaires et des militaires instituée à compter du 1er août 1990 est attribuée pour certains emplois comportant une responsabilité ou une technicité particulières dans des conditions fixées par décret. II. - Elle est prise en compte pour le calcul de la pension de retraite dans les conditions fixées ci-après, et elle est soumise à une cotisation pour la vieillesse."
source_loi = "https://www.legifrance.gouv.fr/loda/article_lc/LEGIARTI000006696481/2026-10-17/ — loi 91-73 art. 27, en vigueur depuis le 01/01/2004 (loi 2003-775 art. 72)"

[nbi.education_nationale]
texte = "Une nouvelle bonification indiciaire, prise en compte et soumise à cotisation pour le calcul de la pension de retraite, peut être versée mensuellement, dans la limite des crédits disponibles, aux fonctionnaires du ministère de l'éducation nationale exerçant une des fonctions figurant en annexe au présent décret."
source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000356073/2026-10-17/ — décret 91-1229 art. 1, en vigueur depuis le 28/08/2004 (décret 2004-876)"
plafond_points = { valeur = 50, texte = "Les fonctions mentionnées à l'annexe au présent décret ne peuvent en aucun cas conduire au versement d'une nouvelle bonification indiciaire supérieure à 50 points.", source = "même URL — art. 2, en vigueur depuis le 01/09/2010 (décret 2010-950)" }
cumul = "non cumulable avec une autre bonification indiciaire d'une autre nature, sauf pour les directeurs d'école (art. 2)"
decret_2006_779 = "MANQUANT : non cherché/lu"

[nbi.calcul]
regle = "Montant = points NBI × valeur du point ; la NBI s'ajoute au traitement indiciaire"
texte_85_1148_art2 = "Les traitements et soldes soumis aux retenues pour pension [...] sont calculés en multipliant le centième de la valeur du traitement fixée à l'article 3 ci-dessous par l'indice majoré correspondant à leur grade ou emploi, et échelon."
valeur_point_annuelle_indice_100 = { valeur = 5907.34, depuis = "2023-07-01", source = "https://www.legifrance.gouv.fr/loda/id/LEGITEXT000006064738/2026-10-17/ — décret 85-1148 art. 3, en vigueur depuis le 01/07/2023 (décret 2023-519), toujours en vigueur au 17/10/2026" }
points_majores = "MANQUANT : aucun texte EN lu ne dit que les points NBI sont des points d'indice majoré (l'arrêté du 06/12/1991 écrit seulement « Points ») ; d'autres ministères l'écrivent (non relu ici)"
temps_partiel = "réduite dans les mêmes proportions que le traitement (décret 93-522 art. 3 ; décret 91-1229 art. 3)"

[nbi.pension]
retenue_pc = true
texte = "prise en compte et soumise à cotisation pour le calcul de la pension de retraite"
source = "décret 91-1229 art. 1 (ci-dessus) ; loi 91-73 art. 27 II ; assiette de la surcotisation L11 bis « y compris nouvelle bonification indiciaire » (CPCMR D5 II)"
note = "Pension : supplément de pension = moyenne annuelle de la NBI perçue × trimestres de perception × rapport L13 (loi 91-73 art. 27 III), pas une intégration dans le traitement des 6 derniers mois."

[nbi.ir_sft_primes]
texte = "Pour le calcul de l'indemnité de résidence et du supplément familial de traitement, la nouvelle bonification indiciaire s'ajoute au traitement indiciaire de l'agent. Elle est réduite dans les mêmes proportions que le traitement en cas de travail à temps partiel."
source = "https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000362602/2026-10-17/ — décret 93-522 art. 3, en vigueur depuis le 28/03/1993"
primes_en_pourcentage = "s'ajoute au traitement indiciaire pour les primes fixées en % du traitement, sauf celles prises en compte pour la pension (art. 4)"
maintien = "maintenue dans les mêmes proportions que le traitement en temps partiel thérapeutique et pendant certains congés (art. 2, version du 31/07/2021, décret 2021-997)"
cotisation_maladie = "soumise à la cotisation prestations en nature maladie (art. 5)"
