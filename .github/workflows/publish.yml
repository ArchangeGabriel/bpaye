name: Release

# bpaye n'est pas publié sur PyPI : une release GitHub reçoit la roue et le sdist, après
# vérification que le tag annonce la version du paquet.
on:
  release:
    types: [published]

permissions:
  contents: write  # joindre les fichiers à la release

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
      - run: uv build
      - name: Le tag correspond à la version du paquet
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # La version lue sur la roue même qui va partir : le build a produit
          # ce que le tag annonce.
          pkg=$(ls dist/*.whl | sed -E 's|.*/[^-]+-([^-]+)-.*|\1|')
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"
      - run: uvx twine check dist/*
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
